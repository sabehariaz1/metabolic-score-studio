name: Build Metabolic Master Render

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          missing=0
          for f in package.json tsconfig.json remotion.config.ts scripts/make_audio.py \
                   src/index.ts src/Root.tsx src/MetabolicShowcase.tsx src/timing.ts src/timing.json \
                   src/components/theme.tsx src/components/ScoreHookScene.tsx \
                   src/components/PrevalenceAndGaugeScene.tsx src/components/InsulinMechanismScene.tsx \
                   src/components/RiskMatrixScene.tsx src/components/DiagnosticsScene.tsx \
                   src/components/PreventionAndRefsScene.tsx; do
            if [ ! -f "$f" ]; then echo "::error::Missing file: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "Repository tree:"; find . -path ./.git -prune -o -type f -print | head -80
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system packages (fonts, ffmpeg, Chrome libraries)
        run: |
          sudo apt-get update || true
          for p in ffmpeg fonts-dejavu-core fonts-dejavu-extra libnss3 libdbus-1-3 libatk1.0-0t64 \
                   libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 \
                   libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64; do
            sudo apt-get install -y "$p" || echo "skipping $p"
          done
          fc-cache -f

      - name: Install Python packages for audio
        run: python3 -m pip install --break-system-packages numpy edge-tts gTTS

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate voiceover and ambient music (skipped if you supplied your own)
        run: python3 scripts/make_audio.py

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Render 1080p master MP4
        run: npm run build

      - name: Upload rendered artifact
        uses: actions/upload-artifact@v4
        with:
          name: metabolic-master-render
          path: out/metabolic-master.mp4
          retention-days: 14
