name: Build Metabolic Master Render

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
          fc-cache -f

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Render 1080p master MP4
        run: npm run build

      - name: Upload rendered artifact
        uses: actions/upload-artifact@v4
        with:
          name: metabolic-master-render
          path: out/metabolic-master.mp4
          retention-days: 14
